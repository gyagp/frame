<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
      {
        "imports": {
          "three": "/three/build/three.module.js",
          "three/addons/": "/three/examples/jsm/"
        }
      }
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #102030;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .label {
        position: fixed;
        left: 5%;
        color: #f1f3ef;
        font: 14px Arial;
        letter-spacing: 0.08em;
        text-shadow: 0 1px 8px #000;
        pointer-events: none;
      }
      .top {
        top: 5%;
      }
      .bottom {
        bottom: 5%;
        font-size: 11px;
        letter-spacing: 0.03em;
      }
    </style>
  </head>
  <body>
    <canvas id="frame"></canvas>
    <div class="label top">3D RENDERER FEASIBILITY / LOCAL WINDOWS TEST</div>
    <div class="label bottom">
      code-doc-film · bangbuilds · d3078a8 / Three.js 0.181.2 / silent technical
      probe
    </div>
    <script type="module">
      import * as THREE from "three";
      import { createRenderer, setView, QA } from "/film/engine.js";
      import scene from "/scenes/f01_hook.js";
      try {
        const width = 1280,
          height = 720;
        setView(width, height);
        const canvas = document.querySelector("#frame");
        const renderer = createRenderer(canvas);
        const state = scene.setup();
        renderer.renderer.info.autoReset = false;
        const gl = renderer.renderer.getContext(),
          debug = gl.getExtension("WEBGL_debug_renderer_info");
        window.renderAt = (time) => {
          QA.reset("reference fleet");
          renderer.renderer.info.reset();
          const out = scene.shots.fleet({
            t: 12 + time,
            lt: time,
            k: Math.max(0, Math.min(1, time / 6)),
            S: state,
          });
          renderer.render(
            out.world.scene,
            out.world.camera,
            12 + time,
            out.post,
          );
          return {
            camera: out.world.camera.position.toArray(),
            warnings: [...QA.now],
            calls: renderer.renderer.info.render.calls,
            triangles: renderer.renderer.info.render.triangles,
          };
        };
        window.clearShot = () => {
          scene.shots.empty({ t: 1, k: 0.5, S: state });
        };
        window.probeInfo = {
          threeRevision: THREE.REVISION,
          width,
          height,
          renderer: debug
            ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL)
            : gl.getParameter(gl.RENDERER),
          vendor: debug
            ? gl.getParameter(debug.UNMASKED_VENDOR_WEBGL)
            : gl.getParameter(gl.VENDOR),
          webglVersion: gl.getParameter(gl.VERSION),
        };
        window.renderAt(0);
        window.probeReady = true;
      } catch (e) {
        window.probeError = String(e.stack || e);
        document.body.textContent = window.probeError;
      }
    </script>
  </body>
</html>
